name: sweety

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sweety}
      POSTGRES_USER: ${POSTGRES_USER:-sweety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sweety_dev_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - sweety-network

  redis:
    image: redis:7-alpine
    # Cache data is disposable, so persistence is deliberately off.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - sweety-network

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: development
    environment:
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sweety}:${POSTGRES_PASSWORD:-sweety_dev_password}@postgres:5432/${POSTGRES_DB:-sweety}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is missing - copy .env.example to .env and set a value of at least 32 characters (see README)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_CACHE_TTL_SECONDS: ${REDIS_CACHE_TTL_SECONDS:-60}
    ports:
      - '${SERVER_PORT:-5000}:5000'
    volumes:
      - ./apps/server/src:/app/apps/server/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5000/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    init: true
    networks:
      - sweety-network

  worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: development
    # Dedicated BullMQ worker process — never started inside the HTTP server.
    command: ['npm', 'run', 'dev:worker', '--workspace', '@sweety/server']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-sweety}:${POSTGRES_PASSWORD:-sweety_dev_password}@postgres:5432/${POSTGRES_DB:-sweety}
      # The env schema is shared with the API and validates JWT_SECRET even
      # though the worker itself never signs tokens.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is missing - copy .env.example to .env and set a value of at least 32 characters (see README)}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_CACHE_TTL_SECONDS: ${REDIS_CACHE_TTL_SECONDS:-60}
      REPORT_JOB_ATTEMPTS: ${REPORT_JOB_ATTEMPTS:-3}
      REPORT_JOB_BACKOFF_MS: ${REPORT_JOB_BACKOFF_MS:-1000}
      REPORT_JOB_RETENTION_SECONDS: ${REPORT_JOB_RETENTION_SECONDS:-3600}
    volumes:
      - ./apps/server/src:/app/apps/server/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The worker is optional for the API's liveness: reports still work from
    # PostgreSQL while the worker restarts.
    restart: unless-stopped
    init: true
    networks:
      - sweety-network

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      target: development
    environment:
      NODE_ENV: development
      VITE_API_PROXY_TARGET: http://server:5000
    ports:
      - '${CLIENT_PORT:-5173}:5173'
    volumes:
      - ./apps/client/src:/app/apps/client/src
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    init: true
    networks:
      - sweety-network

volumes:
  postgres_data:
    name: sweety_postgres_data

networks:
  sweety-network:
    name: sweety-network
    driver: bridge
